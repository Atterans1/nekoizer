<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nekoizer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="titlebar">
  <div class="titlebar-left">
    <h1>Nekoizer</h1>
    <span class="version">v1.0.0</span>
  </div>
  <div class="conn" id="conn" data-state="down"><span class="dot"></span><span id="conn-text">connecting</span></div>
</header>
<div class="banner" id="banner" hidden></div>

<div class="layout">
  <aside class="rail">
    <section class="card">
      <h2>Voice Slots</h2>
      <div id="slots" class="slots"></div>
      <div class="slot slot-drop" id="drop" tabindex="0" role="button">
        <span class="plus">+</span><span>drop audio or RVC</span>
        <input type="file" id="file" accept=".wav,.flac,.ogg,.mp3,.pth,.zip,.index" hidden>
      </div>
      <div class="err" id="upload-err"></div>
    </section>
    <section class="card">
      <h2>Presets</h2>
      <div id="presets" class="presets"></div>
      <div class="row preset-row">
        <input type="text" id="preset-name" placeholder="Preset name">
        <button id="save-preset" class="primary" type="button">Save</button>
      </div>
      <div class="err" id="preset-err"></div>
    </section>

    <section class="card">
      <h2>Import from URL</h2>
      <div class="ctl">
        <label for="url-input">Paste an audio or RVC link</label>
        <input type="text" id="url-input" placeholder="paste an audio or RVC link">
      </div>
      <button id="url-go" class="primary" type="button">Import</button>
      <div class="err" id="url-err"></div>
    </section>
  </aside>

  <main class="center">
    <section class="card">
      <h2>Control</h2>
        <div class="ctl"><label for="input-device">Input</label><select id="input-device"></select></div>
        <div class="ctl"><label for="output-device">Output</label><select id="output-device"></select></div>
      <div class="row">
        <button id="start" class="primary" type="button">Start</button>
        <span class="runstate" id="runstate" data-running="false">stopped</span>
      </div>
      <div class="err" id="start-err"></div>
    </section>

    

    <section class="card">
      <h2>Tuning</h2>
      <div class="meter"><span class="mlabel">IN</span><div class="bar"><div class="fill" id="in-fill"></div></div><span class="mval" id="in-db">-</span></div>
      <div class="meter"><span class="mlabel">OUT</span><div class="bar"><div class="fill" id="out-fill"></div></div><span class="mval" id="out-db">-</span></div>
      <div class="ctl" data-key="output_gain" data-label="Out gain"></div>
    </section>

    <section class="card">
      <h2>Tuning</h2>
      <div class="ctl" data-key="pitch_semitones" data-label="Tune" data-unit="st" data-signed="1"></div>
      <div class="ctl" data-key="timbre_blend" data-label="Timbre blend"></div>
      <div class="ctl" data-key="f0_preserve" data-label="Preserve F0"></div>
    </section>
  </main>

  <aside class="side">
    <section class="card perf">
      <h2>Performance</h2>
      <div class="perf-grid">
        <div><span class="k">Latency</span><span class="v" id="p-e2e">-</span></div>
        <div><span class="k">Inference</span><span class="v"><span class="rt" id="p-rt" data-ok="unknown"></span><span id="p-inf">-</span></span></div>
        <div><span class="k">GPU</span><span class="v" id="p-gpu">-</span></div>
        <div><span class="k">CPU</span><span class="v" id="p-cpu">-</span></div>
        <div><span class="k">Backend</span><span class="v" id="p-backend">-</span></div>
      </div>
      <div class="drop" id="p-drop" tabindex="0" role="button"><span>drop a file to test</span></div>
    </section>
    <section class="card">
      <h2>Voice Creator</h2>
      <div class="row">
        <input type="text" id="vg-text" placeholder="Describe the voice">
      </div>
      <button id="vg-create" class="primary" type="button">Create</button>
      <div class="err" id="vg-err"></div>
      <div class="vg-result" id="vg-result" hidden>
        <audio id="vg-audio" controls></audio>
        <div class="row">
          <a id="vg-download" href="#">Download</a>
          <a id="vg-source" href="#">Source</a>
        </div>
        <div class="vg-log" id="vg-log"></div>
        <div class="row">
          <button id="vg-accept" class="primary" type="button">Accept</button>
          <button id="vg-reject" type="button">Reject</button>
        </div>
      </div>
    </section>
  </aside>
</div>
<script src="/static/app.js"></script>
</body>
</html>
